<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t;try{var p=new URLSearchParams(window.location.search).get('theme');t=p||localStorage.getItem('theme')}catch(e){}if(t==='gruvbox'||t==='slick')t='gruvbox-material';var v=['amber','mallow','gruvbox-material','safelight','tungsten','opal'];var def=(window.matchMedia&&window.matchMedia('(max-width: 768px)').matches)?'safelight':'amber';if(v.indexOf(t)<0)t=def;document.documentElement.setAttribute('data-theme',t);var f;try{var pf=new URLSearchParams(window.location.search).get('font');f=pf||localStorage.getItem('font')}catch(e){}var fv=['maple','iosevka','space'];if(fv.indexOf(f)<0)f='space';document.documentElement.setAttribute('data-font',f);document.documentElement.classList.add('js')})();</script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preload" href="/fonts/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/SpaceMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <meta name="description" content="{{ config.description }}">
{% block head %}{% endblock head %}
</head>
<body class="{% block body_class %}{% endblock body_class %}">
<div id="scroll-bar" aria-hidden="true"></div>
{% block canvas %}<canvas id="grid-canvas"></canvas>{% endblock canvas %}

<nav class="top">
  <a href="/" class="logo">{% include "cat-logo.html" %}<span class="logo-text"><span class="logo-sym">~</span>viyoga</span></a>
  <ul class="nav-links" id="nav-links">
    <li><a href="/#notes">novels</a></li>
    <li><a href="/#stack">stack</a></li>
    <li><a href="/#dictionary">dict</a></li>
    <li><a href="/#stats">stats</a></li>
  </ul>
  <div class="theme-pick">
    <button class="theme-btn" id="font-btn" type="button" aria-label="Font" title="Font"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
  </div>
  <div class="theme-pick">
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Theme" title="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <a href="https://github.com/viyoga/viyoga.github.io" class="rule" title="viyoga repository">(&gt;.&lt;) zzZ</a>
</footer>

<script defer src="/js/copy.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/font.js"></script>
<script defer src="/js/anim.js"></script>
<script defer src="/js/spotlight.js"></script>
{% block extrascripts %}<script defer src="/js/grid.js"></script>{% endblock extrascripts %}
</body>
</html>
