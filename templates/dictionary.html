{% extends "base.html" %}

{% block title %}dictionary — {{ config.title }}{% endblock title %}

{% block content %}
<main>

<div class="wrap wrap-wide">
  <nav class="back-link">
    <a href="/">&larr; Home</a>
  </nav>

  <div class="terminal terminal-dict spot">
    <div class="terminal-bar">
      <span>tty2</span>
      <div class="terminal-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-cyan"></span>
      </div>
    </div>
    <div class="terminal-body" style="align-items:stretch;">
      <div class="prompt"><span>$</span> dict</div>

      <form id="dict-form" class="dict-search">
        <span class="dict-prompt">></span>
        <input type="text" id="dict-input" class="dict-input" value="viyoga" autocomplete="off" autofocus>
        <button type="submit" class="dict-submit">↵</button>
      </form>

      <div id="dict-output" class="dict-output"></div>
    </div>
  </div>
</div>

</main>

<script src="/js/dict-engine.js"></script>
<script>
(function() {
  var FETCH_TIMEOUT_MS = 8000;
  var WORDLIST_URL = '/js/dict-wordlist.js';
  var MAX_DEFS_PER_POS = 3;

  var form = document.getElementById('dict-form');
  var input = document.getElementById('dict-input');
  var submitBtn = form.querySelector('.dict-submit');
  var output = document.getElementById('dict-output');

  // Tracks the request currently allowed to write to the DOM. Any older,
  // superseded request checks against this before rendering.
  var currentController = null;
  var wordlistLoaded = false;

  var jabs = [
    'nice try. did you mean to spell that correctly?',
    'that\'s not a word. try again, genius.',
    'spell check is free, you know.',
    'did you hit the keyboard with your face?',
    'not in the dictionary. shocking.',
    'maybe try English next time.',
    'i looked it up. it doesn\'t exist. just like— nevermind.',
    'you call that a word?',
    'are you sure you know how to read?',
    'that word is as real as your plans.',
    'congratulations. you invented a word nobody uses.',
    'error 404: word not found. skill issue.',
    'did you have a stroke while typing?',
    'the dictionary said "lol no".',
    'that\'s not a word. try harder.',
    'are you typing with your elbows?',
    'even autocorrect gave up on that one.',
    'i googled it. nothing. embarrassing.',
  ];
  var kaomoji = [
    '(◍•ᴗ•◍)♡ ✧*。', '(つ◉益◉)つ', '(╯°□°）╯︵ ┻━┻',
    '(⊙_⊙)', '(¬_¬)', '(￣ヘ￣)', 'ಠ_ಠ', '(；一_一)',
    '(▀̿̿Ĺ̯̿̿▀̿ ̿)', '( ͡° ͜ʖ ͡°)', '(ʘ‿ʘ)', 'ʕ•ᴥ•ʔ',
    '(ノಠ益ಠ)ノ', '︵ヽ(`Д´)ﾉ︵', '┐(\'～`;)┌',
    '(◔_◔)', '(-_-;)', '(＃￣ω￣)', '＜（－︿－）＞',
    '(◕‿◕)', '(ᗒᗨᗕ)', 'ヽ(´ー｀)ノ', '＼(◎o◎)／',
    '(＾▽＾)', 'ᕙ(▀̿̿Ĺ̯̿̿▀̿ ̿)ᕗ', '┬─┬ノ( º _ ºノ)',
    '(ಥ_ಥ)', '(◞‸◟)', '〳◔Ĺ̯◔〵', '(;´Д`)',
    '(´-ω-`)', '〜(꒪꒳꒪)〜', '(˘̩̩̩̩̩̩̩̩˘)', '(个_个)',
    'ヽ(￣д￣;)ノ', '(￣□￣;)', '∑(O_O;)', '(╯▽╰)',
  ];

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setLoading(isLoading, keepInputActive) {
    if (!keepInputActive) {
      input.disabled = isLoading;
    }
    submitBtn.disabled = isLoading;
  }

  var dictCache = {};
  try {
    var saved = sessionStorage.getItem('viyoga_dict_cache');
    if (saved) dictCache = JSON.parse(saved);
  } catch (e) {}

  function saveCache(word, entry) {
    try {
      dictCache[word] = entry;
      var keys = Object.keys(dictCache);
      if (keys.length > 80) delete dictCache[keys[0]];
      sessionStorage.setItem('viyoga_dict_cache', JSON.stringify(dictCache));
    } catch (e) {}
  }

  function renderSkeleton(word) {
    return '<div class="dict-result dict-skeleton-result" aria-busy="true" aria-label="Loading definition">'
      + '<div class="skeleton-line skeleton-title"></div>'
      + '<div class="skeleton-line skeleton-subtitle"></div>'
      + '<div class="skeleton-block"></div>'
      + '<div class="skeleton-line skeleton-text"></div>'
      + '<div class="skeleton-line skeleton-text-short"></div>'
      + '</div>';
  }

  function bindRetry() {
    var btn = output.querySelector('.dict-retry');
    if (btn) {
      btn.addEventListener('click', function() {
        output.innerHTML = '';
        input.value = '';
        input.focus();
      });
    }
  }

  function currentLang() {
    return DictEngine.defaultLanguage();
  }

  function fetchExtract(word, controller) {
    var url = DictEngine.lookupUrl(word, currentLang());
    if (!url) return Promise.reject(new Error('empty query'));
    return fetch(url, { signal: controller.signal })
      .then(function(r) {
        if (!r.ok) throw new Error('server error: ' + r.status);
        return r.text();
      });
  }

  // case-insensitive lookup: check cache, then walk candidate spellings until one hits
  function lookup(word, controller) {
    var key = word.trim().toLowerCase();
    if (dictCache[key]) {
      return Promise.resolve(dictCache[key]);
    }
    var candidates = DictEngine.lookupCandidates(word);
    var i = 0;

    function attempt() {
      if (i >= candidates.length) {
        var nf = new Error('no entry for "' + word + '"');
        nf.notFound = true;
        throw nf;
      }
      return fetchExtract(candidates[i++], controller).then(function(raw) {
        var res = DictEngine.parseResponse(raw, currentLang());
        if (res.ok) {
          saveCache(key, res.entry);
          return res.entry;
        }
        // try next spelling on misses; real failures bubble up
        if (res.kind === 'notfound' || res.kind === 'empty') return attempt();
        throw new Error(res.error || 'lookup failed');
      });
    }

    return Promise.resolve().then(attempt);
  }

  function loadWordlist() {
    if (wordlistLoaded) return Promise.resolve();
    if (typeof ENGLISH_WORDLIST !== 'undefined') {
      DictEngine.setWordlist(ENGLISH_WORDLIST);
      wordlistLoaded = true;
      return Promise.resolve();
    }
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = WORDLIST_URL;
      s.onload = function() {
        DictEngine.setWordlist(typeof ENGLISH_WORDLIST !== 'undefined' ? ENGLISH_WORDLIST : []);
        wordlistLoaded = true;
        resolve();
      };
      s.onerror = function() { reject(new Error('wordlist failed to load')); };
      document.head.appendChild(s);
    });
  }

  function renderNotFoundWithSuggestions(word) {
    var fuzzy = DictEngine.fuzzyMatch(word);
    if (fuzzy.autoMatch) {
      output.innerHTML = '<p class="dict-status"><span class="live-dot"></span> did you mean “'
        + escapeHTML(fuzzy.autoMatch) + '”? looking that up…</p>';
      doLookup(fuzzy.autoMatch, output.innerHTML);
      return;
    }
    if (fuzzy.alternatives.length) {
      var html = '<div class="dict-mock">'
        + '<p class="dict-jab">not found. did you mean:</p>'
        + '<p class="dict-chips">';
      for (var i = 0; i < fuzzy.alternatives.length; i++) {
        html += '<button type="button" class="dict-chip" data-word="'
          + escapeHTML(fuzzy.alternatives[i]) + '">' + escapeHTML(fuzzy.alternatives[i]) + '</button>';
      }
      html += '</p><button class="dict-retry">try again ↵</button></div>';
      output.innerHTML = html;
      var chips = output.querySelectorAll('.dict-chip');
      for (var c = 0; c < chips.length; c++) {
        chips[c].addEventListener('click', function() {
          doLookup(this.getAttribute('data-word'), false);
        });
      }
      bindRetry();
      return;
    }
    renderNotFound();
  }

  function renderNotFound() {
    var jab = jabs[Math.floor(Math.random() * jabs.length)];
    var kao = kaomoji[Math.floor(Math.random() * kaomoji.length)];
    output.innerHTML = '<div class="dict-mock">'
      + '<p class="dict-jab">' + escapeHTML(jab) + '</p>'
      + '<p class="dict-kao">' + escapeHTML(kao) + '</p>'
      + '<button class="dict-retry">try again ↵</button>'
      + '</div>';
    bindRetry();
  }

  function renderServerError() {
    output.innerHTML = '<div class="dict-mock">'
      + '<p class="dict-jab">dictionary\'s not answering right now. not your fault.</p>'
      + '<p class="dict-kao">(￣ヘ￣)</p>'
      + '<button class="dict-retry">try again ↵</button>'
      + '</div>';
    bindRetry();
  }

  function renderTimeoutError() {
    output.innerHTML = '<div class="dict-mock">'
      + '<p class="dict-jab">that took too long. try again?</p>'
      + '<p class="dict-kao">(-_-;)</p>'
      + '<button class="dict-retry">try again ↵</button>'
      + '</div>';
    bindRetry();
  }

  function renderResult(entry) {
    var html = '<div class="dict-result">';
    html += '<div class="dict-word-row">';
    html += '<span class="dict-word">' + escapeHTML(entry.word) + '</span>';
    if (entry.phonetic) html += '<span class="dict-phonetic">' + escapeHTML(entry.phonetic) + '</span>';
    html += '</div>';

    for (var m = 0; m < entry.meanings.length; m++) {
      var meaning = entry.meanings[m];
      html += '<div class="dict-meaning">';
      html += '<span class="dict-pos">' + escapeHTML(meaning.partOfSpeech || '') + '</span>';

      var defs = meaning.definitions || [];
      for (var d = 0; d < Math.min(defs.length, MAX_DEFS_PER_POS); d++) {
        var def = defs[d];
        html += '<p class="dict-def">' + escapeHTML(def.definition) + '</p>';
        if (def.example) {
          html += '<p class="dict-example">“' + escapeHTML(def.example) + '”</p>';
        }
      }

      html += '</div>';
    }

    html += '</div>';
    output.innerHTML = html;

    attachAudioButton(entry.word);
  }

  function attachAudioButton(word) {
    // Wiktionary extracts carry no audio, and gstatic has no CORS headers,
    // so pronunciation is generated lazily on click via tts.ai (Kokoro,
    // consistent voice, full CORS), falling back to gstatic's US recording.
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dict-audio';
    btn.setAttribute('aria-label', 'play pronunciation');
    btn.innerHTML = '&#9658;';

    var busy = false;
    btn.addEventListener('click', function() {
      if (busy) return;
      busy = true;
      btn.innerHTML = '…';

      fetch('https://api.tts.ai/v1/tts/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'kokoro', text: word, voice: 'af_bella', format: 'mp3' })
      })
        .then(function(r) {
          if (!r.ok) throw new Error('tts status ' + r.status);
          return r.json();
        })
        .then(function(data) {
          var url = data && data.result_url;
          if (!url) throw new Error('no result_url');
          return new Audio(url).play();
        })
        .catch(function() {
          var gs = 'https://ssl.gstatic.com/dictionary/static/sounds/20200429/'
            + encodeURIComponent(word) + '--_us_1.mp3';
          return new Audio(gs).play();
        })
        .catch(function() {})
        .then(function() {
          btn.innerHTML = '&#9658;';
          busy = false;
        });
    });

    var row = output.querySelector('.dict-word-row');
    if (row) row.appendChild(btn);
  }

  function doLookup(word, statusOverride, isAuto) {
    setLoading(true, isAuto);
    output.innerHTML = statusOverride || renderSkeleton(word);

    if (currentController) currentController.abort();
    var controller = new AbortController();
    currentController = controller;
    var timeoutId = setTimeout(function() { controller.abort(); }, FETCH_TIMEOUT_MS);

    lookup(word, controller)
      .then(function(entry) {
        clearTimeout(timeoutId);
        renderResult(entry);
      })
      .catch(function(err) {
        clearTimeout(timeoutId);
        // A newer submit already took over — let it own the output.
        if (controller !== currentController) return;

        if (err && err.name === 'AbortError') {
          renderTimeoutError();
        } else if (err && err.notFound) {
          loadWordlist()
            .then(function() { renderNotFoundWithSuggestions(word); })
            .catch(renderNotFound);
        } else {
          renderServerError();
        }
      })
      .then(function() {
        if (controller === currentController) setLoading(false, false);
      });
  }

  var debounceTimer = null;
  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var word = input.value.trim();
    if (!word) {
      if (currentController) currentController.abort();
      output.innerHTML = '';
      return;
    }
    if (word.length >= 2) {
      debounceTimer = setTimeout(function() {
        doLookup(word, null, true);
      }, 350);
    }
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearTimeout(debounceTimer);
    var word = input.value.trim();
    if (!word) return;
    doLookup(word);
  });

  // Pre-loaded showcase: "viyoga" is already typed; show its entry at once.
  input.value = 'viyoga';
  doLookup('viyoga');
})();
</script>
{% endblock content %}
